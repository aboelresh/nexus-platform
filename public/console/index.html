<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusPlatform — Developer Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;
--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',monospace;font-size:13px}
.layout{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:20px 16px;border-bottom:1px solid var(--border)}
.logo h1{font-size:15px;color:var(--accent);font-weight:700}
.logo p{font-size:11px;color:var(--text2);margin-top:2px}
.nav-section{padding:12px 8px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--text2);transition:.15s;margin:1px 8px;border:none;background:none;width:calc(100% - 16px);text-align:left;font-size:13px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:#1f6feb33;color:var(--accent)}
.nav-item .icon{font-size:15px;width:20px;text-align:center}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px}
.badge.green{background:var(--green)}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
.topbar h2{font-size:15px;font-weight:600;flex:1}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.success{border-color:var(--green);color:var(--green)}
.content{flex:1;overflow-y:auto;padding:20px}

/* Cards */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.card .value{font-size:24px;font-weight:700;color:var(--text)}
.card .sub{font-size:11px;color:var(--text2);margin-top:4px}

/* Status */
.status-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.status-row:last-child{border-bottom:none}
.status-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;display:inline-block}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot-yellow{background:var(--yellow)}
.status-label{display:flex;align-items:center;font-size:13px}
.status-msg{font-size:11px;color:var(--text2);text-align:right;max-width:200px}

/* Table */
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;padding:8px 12px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500}
.table td{padding:8px 12px;border-bottom:1px solid #21262d}
.table tr:hover td{background:#161b2260}

/* Log */
.log-entry{padding:8px 12px;border-radius:6px;margin-bottom:4px;font-family:monospace;font-size:12px;border-left:3px solid transparent}
.log-error{background:#f8514915;border-color:var(--red)}
.log-warning{background:#d2992215;border-color:var(--yellow)}
.log-info{background:#58a6ff15;border-color:var(--accent)}
.log-debug{background:#8b949e15;border-color:var(--text2)}
.log-time{color:var(--text2);font-size:10px}

/* Doctor */
.doctor-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.doctor-header{padding:20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border)}
.score-circle{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:3px solid}
.issue-item{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px}
.issue-icon{font-size:18px;margin-top:2px}
.issue-fix{font-size:11px;color:var(--text2);margin-top:4px;font-family:monospace;background:var(--bg3);padding:3px 8px;border-radius:4px;display:inline-block;margin-top:6px}

/* Playground */
.playground{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}
.play-left,.play-right{background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column}
.play-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.method-select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700}
.url-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px}
.url-input:focus{outline:none;border-color:var(--accent)}
.play-body{flex:1;padding:12px;overflow:auto}
.code-area{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-family:monospace;font-size:12px;resize:none;height:120px}
.code-area:focus{outline:none;border-color:var(--accent)}
.response-area{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;min-height:200px}

/* Tabs */
.tab-bar{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2);white-space:nowrap}
.tab.active{background:var(--accent);color:#000;font-weight:600}
.tab:hover:not(.active){background:var(--bg3);color:var(--text)}

/* Filters */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:11px}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:#58a6ff15}

/* Misc */
.kv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #21262d;font-size:12px}
.kv-key{color:var(--text2)}
.kv-val{color:var(--text);font-family:monospace;text-align:right;max-width:60%}
.tag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-green{background:#3fb95020;color:var(--green);border:1px solid #3fb95040}
.tag-red{background:#f8514920;color:var(--red);border:1px solid #f8514940}
.tag-blue{background:#58a6ff20;color:var(--accent);border:1px solid #58a6ff40}
.tag-yellow{background:#d2992220;color:var(--yellow);border:1px solid #d2992240}
.empty{color:var(--text2);text-align:center;padding:40px;font-size:13px}
.loading{color:var(--text2);text-align:center;padding:40px}
input[type=text],select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
.progress-bar{background:var(--bg3);border-radius:10px;height:6px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:10px;background:var(--accent);transition:.3s}
.section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
</style>
</head>
<body>
<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="logo">
    <h1>⚡ NexusPlatform</h1>
    <p>Developer Console</p>
  </div>

  <div class="nav-section">Diagnostics</div>
  <button class="nav-item active" onclick="showTab('health')"><span class="icon">🏥</span> Health Check</button>
  <button class="nav-item" onclick="showTab('doctor')"><span class="icon">🔬</span> System Doctor</button>
  <button class="nav-item" onclick="showTab('environment')"><span class="icon">⚙️</span> Environment</button>
  <button class="nav-item" onclick="showTab('performance')"><span class="icon">📊</span> Performance</button>

  <div class="nav-section">Infrastructure</div>
  <button class="nav-item" onclick="showTab('database')"><span class="icon">🗄️</span> Database</button>
  <button class="nav-item" onclick="showTab('queue')" id="nav-queue"><span class="icon">⚡</span> Queue</button>
  <button class="nav-item" onclick="showTab('redis')"><span class="icon">🔴</span> Redis</button>
  <button class="nav-item" onclick="showTab('storage')"><span class="icon">💾</span> Storage</button>

  <div class="nav-section">Application</div>
  <button class="nav-item" onclick="showTab('logs')"><span class="icon">📋</span> Logs</button>
  <button class="nav-item" onclick="showTab('security')"><span class="icon">🔒</span> Security</button>

  <div class="nav-section">Tools</div>
  <button class="nav-item" onclick="showTab('playground')"><span class="icon">🎮</span> API Playground</button>

  <div style="margin-top:auto;padding:16px;border-top:1px solid var(--border)">
    <div style="font-size:11px;color:var(--text2)">Auto-refresh</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
      <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
      <label for="autoRefresh" style="font-size:12px;color:var(--text2)">Every 10s</label>
    </div>
    <div style="font-size:10px;color:var(--text2);margin-top:8px" id="lastRefresh">—</div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="topbar">
    <h2 id="tab-title">Health Check</h2>
    <span id="tab-subtitle" style="font-size:11px;color:var(--text2)"></span>
    <button class="btn" onclick="refreshCurrent()">↻ Refresh</button>
    <button class="btn primary" onclick="showTab('doctor')">🔬 Run Doctor</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading...</div>
  </div>
</main>

</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token') || 'nexus-dev-console-2026';
const BASE = '/devtools/api';
let currentTab = 'health';
let autoRefreshTimer = null;

async function api(endpoint) {
  const r = await fetch(`${BASE}${endpoint}?token=${TOKEN}`, {headers:{'Accept':'application/json','X-Console-Token':TOKEN}});
  return r.json();
}

async function apiPost(endpoint, data) {
  const r = await fetch(`${BASE}${endpoint}?token=${TOKEN}`, {
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json','X-Console-Token':TOKEN},
    body:JSON.stringify(data)
  });
  return r.json();
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${tab}')"]`)?.classList.add('active');
  const titles = {
    health:'Health Check',doctor:'System Doctor',environment:'Environment',
    performance:'Performance',database:'Database',queue:'Queue',
    redis:'Redis',storage:'Storage',logs:'Logs',security:'Security',playground:'API Playground'
  };
  document.getElementById('tab-title').textContent = titles[tab] || tab;
  document.getElementById('content').innerHTML = '<div class="loading">⏳ Loading...</div>';
  const fn = {
    health:loadHealth, doctor:loadDoctor, environment:loadEnvironment,
    performance:loadPerformance, database:loadDatabase, queue:loadQueue,
    redis:loadRedis, storage:loadStorage, logs:loadLogs,
    security:loadSecurity, playground:loadPlayground
  };
  fn[tab]?.();
}

function refreshCurrent() { showTab(currentTab); }

function toggleAutoRefresh() {
  clearInterval(autoRefreshTimer);
  if (document.getElementById('autoRefresh').checked) {
    autoRefreshTimer = setInterval(() => { showTab(currentTab); }, 10000);
  }
}

// ══════════════════════════════════
// HEALTH CHECK
// ══════════════════════════════════
async function loadHealth() {
  const d = await api('/health');
  const items = Object.entries(d).map(([key, val]) => `
    <div class="status-row">
      <div class="status-label">
        <span class="status-dot ${val.status ? 'dot-green' : 'dot-red'}"></span>
        <strong>${key.charAt(0).toUpperCase()+key.slice(1)}</strong>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="status-msg">${val.message || ''}</span>
        <span class="tag ${val.status ? 'tag-green' : 'tag-red'}">${val.status ? 'OK' : 'FAIL'}</span>
      </div>
    </div>
  `).join('');
  const all = Object.values(d).every(v => v.status);
  document.getElementById('content').innerHTML = `
    <div class="grid grid-2" style="margin-bottom:16px">
      <div class="card" style="border-color:${all?'var(--green)':'var(--red)'}">
        <h3>Overall Status</h3>
        <div class="value" style="color:${all?'var(--green)':'var(--red)'}">${all?'✅ Healthy':'⚠️ Issues Found'}</div>
        <div class="sub">${Object.values(d).filter(v=>v.status).length}/${Object.values(d).length} services running</div>
      </div>
      <div class="card">
        <h3>Checked At</h3>
        <div class="value" style="font-size:16px">${new Date().toLocaleTimeString()}</div>
        <div class="sub">${new Date().toLocaleDateString()}</div>
      </div>
    </div>
    <div class="card">${items}</div>
  `;
  document.getElementById('lastRefresh').textContent = 'Last: ' + new Date().toLocaleTimeString();
}

// ══════════════════════════════════
// SYSTEM DOCTOR
// ══════════════════════════════════
async function loadDoctor() {
  const d = await api('/doctor');
  const scoreColor = d.score >= 80 ? 'var(--green)' : d.score >= 50 ? 'var(--yellow)' : 'var(--red)';
  const checkItems = Object.entries(d.checks).map(([key, val]) => `
    <div class="status-row">
      <div class="status-label">
        <span class="status-dot ${val.status ? 'dot-green' : 'dot-red'}"></span>
        <strong>${key.charAt(0).toUpperCase()+key.slice(1)}</strong>
      </div>
      <span class="tag ${val.status ? 'tag-green' : 'tag-red'}">${val.status ? 'OK' : 'FAIL'}</span>
    </div>
  `).join('');
  const issueItems = d.issues.length ? d.issues.map(i => `
    <div class="issue-item">
      <div class="issue-icon">⚠️</div>
      <div>
        <div style="font-weight:600;color:var(--yellow)">${i.problem}</div>
        <div class="issue-fix">💡 ${i.fix}</div>
      </div>
    </div>
  `).join('') : '<div class="empty">✅ No issues detected!</div>';
  document.getElementById('content').innerHTML = `
    <div class="doctor-card" style="margin-bottom:16px">
      <div class="doctor-header">
        <div class="score-circle" style="color:${scoreColor};border-color:${scoreColor}">${d.score}%</div>
        <div>
          <div style="font-size:18px;font-weight:700">${d.healthy ? '✅ System Healthy' : '⚠️ Issues Detected'}</div>
          <div style="color:var(--text2);font-size:12px;margin-top:4px">Checked at ${new Date(d.checked_at).toLocaleTimeString()}</div>
        </div>
      </div>
      <div style="padding:16px;border-bottom:1px solid var(--border)">
        <div class="section-title">Service Checks</div>
        ${checkItems}
      </div>
      <div>
        <div style="padding:12px 20px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px">Issues & Fixes</div>
        ${issueItems}
      </div>
    </div>
  `;
}

// ══════════════════════════════════
// ENVIRONMENT
// ══════════════════════════════════
async function loadEnvironment() {
  const d = await api('/environment');
  const driverItems = Object.entries(d.drivers).map(([k,v]) => `
    <div class="kv-row"><span class="kv-key">${k}</span><span class="kv-val"><span class="tag tag-blue">${v}</span></span></div>
  `).join('');
  const extItems = Object.entries(d.extensions).map(([k,v]) => `
    <div class="kv-row"><span class="kv-key">${k}</span><span class="kv-val"><span class="tag ${v?'tag-green':'tag-red'}">${v?'loaded':'missing'}</span></span></div>
  `).join('');
  document.getElementById('content').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="card"><h3>PHP Version</h3><div class="value" style="font-size:18px">${d.php}</div></div>
      <div class="card"><h3>Laravel Version</h3><div class="value" style="font-size:18px">${d.laravel}</div></div>
      <div class="card"><h3>Environment</h3>
        <div class="value" style="font-size:18px">
          <span class="tag ${d.environment==='production'?'tag-red':d.environment==='local'?'tag-green':'tag-yellow'}">${d.environment}</span>
        </div>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3>Drivers</h3>${driverItems}</div>
      <div class="card"><h3>PHP Extensions</h3>${extItems}</div>
    </div>
  `;
}

// ══════════════════════════════════
// PERFORMANCE
// ══════════════════════════════════
async function loadPerformance() {
  const d = await api('/performance');
  const memPct = d.memory.percentage || 0;
  const hitRate = d.opcache.hit_rate || 0;
  document.getElementById('content').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="card">
        <h3>Memory Usage</h3>
        <div class="value">${d.memory.current}</div>
        <div class="sub">Peak: ${d.memory.peak} / Limit: ${d.memory.limit}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${memPct}%;background:${memPct>80?'var(--red)':memPct>60?'var(--yellow)':'var(--green)'}"></div></div>
        <div style="font-size:10px;color:var(--text2);margin-top:4px">${memPct}% used</div>
      </div>
      <div class="card">
        <h3>OPcache</h3>
        <div class="value" style="color:${d.opcache.enabled?'var(--green)':'var(--red)'}">${d.opcache.enabled?'Enabled':'Disabled'}</div>
        ${d.opcache.enabled ? `
          <div class="sub">Hit Rate: ${d.opcache.hit_rate}%</div>
          <div class="sub">Cached: ${d.opcache.cached_files} files</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${hitRate}%"></div></div>
        ` : ''}
      </div>
      <div class="card">
        <h3>Server Uptime</h3>
        <div class="value" style="font-size:16px">${d.uptime}</div>
      </div>
    </div>
  `;
}

// ══════════════════════════════════
// DATABASE
// ══════════════════════════════════
async function loadDatabase() {
  const d = await api('/database');
  if (d.error) { document.getElementById('content').innerHTML = `<div class="empty">❌ ${d.error}</div>`; return; }
  const tableRows = d.tables.map(t => `
    <tr>
      <td>${t.TABLE_NAME || t.table_name}</td>
      <td style="text-align:right">${(t.TABLE_ROWS || t.table_rows || 0).toLocaleString()}</td>
      <td style="text-align:right">${t.size_mb || 0} MB</td>
    </tr>
  `).join('');
  document.getElementById('content').innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="card"><h3>Connection</h3><div class="value" style="font-size:14px"><span class="tag tag-green">${d.connection}</span></div></div>
      <div class="card"><h3>Version</h3><div class="value" style="font-size:14px">${d.version}</div></div>
      <div class="card"><h3>Active Connections</h3><div class="value">${d.connections}</div></div>
      <div class="card"><h3>Query Log</h3><div class="value">${d.queries_count}</div><div class="sub">this request</div></div>
    </div>
    <div class="card">
      <h3>Tables</h3>
      <table class="table">
        <thead><tr><th>Table</th><th style="text-align:right">Rows</th><th style="text-align:right">Size</th></tr></thead>
        <tbody>${tableRows || '<tr><td colspan="3" class="empty">No tables</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ══════════════════════════════════
// QUEUE
// ══════════════════════════════════
async function loadQueue() {
  const d = await api('/queue');
  if (d.error) { document.getElementById('content').innerHTML = `<div class="empty">❌ ${d.error}</div>`; return; }
  const failedRows = d.recent_failed.map(j => `
    <tr>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${j.job}</td>
      <td>${j.failed_at}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;color:var(--red)">${j.exception}</td>
      <td>
        <button class="btn" style="padding:2px 8px;font-size:11px" onclick="retryJob('${j.uuid}')">Retry</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('content').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="card"><h3>Pending Jobs</h3><div class="value" style="color:var(--yellow)">${d.pending}</div></div>
      <div class="card"><h3>Failed Jobs</h3><div class="value" style="color:${d.failed>0?'var(--red)':'var(--green)'}">${d.failed}</div></div>
      <div class="card"><h3>Driver</h3><div class="value" style="font-size:14px"><span class="tag tag-blue">${d.driver}</span></div></div>
    </div>
    ${d.recent_failed.length ? `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <h3>Recent Failed Jobs</h3>
          <button class="btn danger" onclick="flushFailed()">🗑 Flush All</button>
        </div>
        <table class="table">
          <thead><tr><th>Job</th><th>Failed At</th><th>Error</th><th>Action</th></tr></thead>
          <tbody>${failedRows}</tbody>
        </table>
      </div>
    ` : '<div class="empty">✅ No failed jobs!</div>'}
  `;
}

// ══════════════════════════════════
// REDIS
// ══════════════════════════════════
async function loadRedis() {
  const d = await api('/redis');
  if (!d.connected) { document.getElementById('content').innerHTML = `<div class="empty">❌ Redis not connected: ${d.error}</div>`; return; }
  const hitRate = d.hit_rate || 0;
  document.getElementById('content').innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="card"><h3>Status</h3><div class="value" style="color:var(--green)">Connected</div><div class="sub">v${d.version}</div></div>
      <div class="card"><h3>Memory Used</h3><div class="value" style="font-size:16px">${d.memory_used}</div><div class="sub">Peak: ${d.memory_peak}</div></div>
      <div class="card"><h3>Keys</h3><div class="value">${d.keys}</div></div>
      <div class="card"><h3>Clients</h3><div class="value">${d.connected_clients}</div></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <h3>Cache Hit Rate</h3>
        <div class="value" style="color:${hitRate>70?'var(--green)':hitRate>40?'var(--yellow)':'var(--red)'}">${hitRate}%</div>
        <div class="progress-bar" style="margin-top:12px"><div class="progress-fill" style="width:${hitRate}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:4px">
          <span>Hits: ${d.keyspace_hits}</span>
          <span>Misses: ${d.keyspace_misses}</span>
        </div>
      </div>
      <div class="card">
        <h3>Stats</h3>
        <div class="kv-row"><span class="kv-key">Total Commands</span><span class="kv-val">${d.total_commands?.toLocaleString()}</span></div>
        <div class="kv-row"><span class="kv-key">Uptime</span><span class="kv-val">${Math.round(d.uptime_seconds/3600)}h ${Math.round((d.uptime_seconds%3600)/60)}m</span></div>
      </div>
    </div>
  `;
}

// ══════════════════════════════════
// LOGS
// ══════════════════════════════════
async function loadLogs(level='all') {
  const d = await api(`/logs?level=${level}&limit=100`);
  const colors = {error:'log-error',warning:'log-warning',info:'log-info',debug:'log-debug'};
  const logItems = d.logs.length ? d.logs.map(l => `
    <div class="log-entry ${colors[l.level]||'log-debug'}">
      <div style="display:flex;gap:8px;align-items:center">
        <span class="log-time">${l.timestamp}</span>
        <span class="tag ${l.level==='error'?'tag-red':l.level==='warning'?'tag-yellow':l.level==='info'?'tag-blue':'tag-blue'}">${l.level}</span>
      </div>
      <div style="margin-top:4px">${l.message}</div>
    </div>
  `).join('') : '<div class="empty">📋 No logs found</div>';
  document.getElementById('content').innerHTML = `
    <div class="filter-row">
      ${['all','error','warning','info','debug'].map(l => `
        <button class="filter-btn ${level===l?'active':''}" onclick="loadLogs('${l}')">${l.toUpperCase()}</button>
      `).join('')}
    </div>
    <div style="max-height:calc(100vh - 200px);overflow-y:auto">${logItems}</div>
  `;
}

// ══════════════════════════════════
// STORAGE
// ══════════════════════════════════
async function loadStorage() {
  const d = await api('/storage');
  if (d.error) { document.getElementById('content').innerHTML = `<div class="empty">❌ ${d.error}</div>`; return; }
  const typeRows = d.by_type?.map(t => `
    <tr>
      <td><span class="tag tag-blue">${t.type}</span></td>
      <td style="text-align:right">${t.count}</td>
      <td style="text-align:right">${t.total_size ? Math.round(t.total_size/1024/1024*100)/100 + ' MB' : '—'}</td>
    </tr>
  `).join('') || '';
  document.getElementById('content').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="card"><h3>Total Size</h3><div class="value" style="font-size:18px">${d.total_size}</div></div>
      <div class="card"><h3>Total Files</h3><div class="value">${d.total_files}</div></div>
      <div class="card"><h3>Free Space</h3><div class="value" style="font-size:18px;color:var(--green)">${d.disk_free}</div></div>
    </div>
    <div class="card">
      <h3>By Type</h3>
      <table class="table">
        <thead><tr><th>Type</th><th style="text-align:right">Files</th><th style="text-align:right">Size</th></tr></thead>
        <tbody>${typeRows || '<tr><td colspan="3" class="empty">No media files</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ══════════════════════════════════
// API PLAYGROUND
// ══════════════════════════════════
function loadPlayground() {
  document.getElementById('content').innerHTML = `
    <div class="playground" style="height:calc(100vh - 120px)">
      <div class="play-left">
        <div class="play-header">
          <select class="method-select" id="playMethod">
            <option style="color:#3fb950">GET</option>
            <option style="color:#d29922">POST</option>
            <option style="color:#ffa657">PUT</option>
            <option style="color:#f85149">DELETE</option>
          </select>
          <input class="url-input" id="playUrl" type="text" placeholder="/api/v1/auth/me" value="/api/v1/health">
          <button class="btn primary" onclick="sendRequest()">Send</button>
        </div>
        <div class="play-body">
          <div class="section-title">Authorization Token</div>
          <input type="text" id="playToken" placeholder="Bearer token..." style="width:100%;margin-bottom:12px">
          <div class="section-title">Request Body (JSON)</div>
          <textarea class="code-area" id="playBody" placeholder='{"key": "value"}'></textarea>
          <div class="section-title" style="margin-top:12px">Quick Endpoints</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${[
              ['/api/health','GET'],
              ['/api/v1/auth/me','GET'],
              ['/api/v1/conversations','GET'],
              ['/api/v1/users/profile','GET'],
              ['/console/api/doctor','GET'],
              ['/console/api/health','GET'],
            ].map(([url,m]) => `<button class="filter-btn" onclick="setPlayground('${url}','${m}')">${m} ${url.split('/').pop()}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="play-right">
        <div class="play-header">
          <span style="color:var(--text2);font-size:12px">Response</span>
          <span id="playStatus" style="margin-left:auto;font-size:12px"></span>
          <span id="playTime" style="font-size:11px;color:var(--text2)"></span>
        </div>
        <pre class="response-area" id="playResponse">// Response will appear here...</pre>
      </div>
    </div>
  `;
}

function setPlayground(url, method) {
  document.getElementById('playUrl').value = url;
  document.getElementById('playMethod').value = method;
}

async function sendRequest() {
  const method  = document.getElementById('playMethod').value;
  const url     = document.getElementById('playUrl').value;
  const token   = document.getElementById('playToken').value;
  const body    = document.getElementById('playBody').value;
  const resArea = document.getElementById('playResponse');
  const start   = Date.now();

  resArea.textContent = '⏳ Sending...';

  const headers = {'Accept':'application/json','X-Console-Token':TOKEN};
  if (token) headers['Authorization'] = token.startsWith('Bearer') ? token : 'Bearer ' + token;
  if (['POST','PUT','PATCH'].includes(method)) headers['Content-Type'] = 'application/json';

  try {
    const r = await fetch(url, {method, headers, body: body && method !== 'GET' ? body : undefined});
    const elapsed = Date.now() - start;
    const text = await r.text();
    let formatted;
    try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch { formatted = text; }
    resArea.textContent = formatted;
    document.getElementById('playStatus').innerHTML = `<span class="tag ${r.ok?'tag-green':'tag-red'}">${r.status} ${r.statusText}</span>`;
    document.getElementById('playTime').textContent = `${elapsed}ms`;
  } catch(e) {
    resArea.textContent = '❌ Error: ' + e.message;
  }
}

// Actions
async function retryJob(uuid) {
  await apiPost('/retry-job', {uuid});
  showTab('queue');
}

async function flushFailed() {
  if (!confirm('Delete all failed jobs?')) return;
  await apiPost('/flush-failed', {});
  showTab('queue');
}

loadHealth();
