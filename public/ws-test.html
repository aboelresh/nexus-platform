<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test - NexusPlatform</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: #eee; }
        .card { background: #16213e; padding: 20px; border-radius: 10px; margin: 10px 0; }
        .status { padding: 8px 16px; border-radius: 5px; display: inline-block; margin: 5px; }
        .connected { background: #2ecc71; color: #fff; }
        .disconnected { background: #e74c3c; color: #fff; }
        .event { background: #0f3460; padding: 10px; margin: 5px 0; border-radius: 5px; font-size: 13px; }
        input, button { padding: 8px 12px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #e94560; color: #fff; cursor: pointer; }
        #log { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>🔌 NexusPlatform WebSocket Test</h2>

    <div class="card">
        <h3>إعداد الاتصال</h3>
        <input type="text" id="token" placeholder="Bearer Token" style="width: 400px">
        <input type="number" id="convId" placeholder="Conversation ID" value="1">
        <button onclick="connect()">اتصال</button>
        <button onclick="disconnect()">قطع الاتصال</button>
        <div id="status" class="status disconnected">غير متصل</div>
    </div>

    <div class="card">
        <h3>الأحداث المستقبلة</h3>
        <button onclick="clearLog()">مسح</button>
        <div id="log"></div>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        let pusher = null;
        let channel = null;

        function log(event, data) {
            const div = document.getElementById('log');
            const time = new Date().toLocaleTimeString('ar');
            div.innerHTML = `<div class="event"><strong>[${time}] ${event}</strong><br><pre>${JSON.stringify(data, null, 2)}</pre></div>` + div.innerHTML;
        }

        function connect() {
            const token = document.getElementById('token').value;
            const convId = document.getElementById('convId').value;

            if (!token) { alert('أدخل الـ Token أولاً'); return; }

            pusher = new Pusher('f2z4g861ahrhwjecgakq', {
    wsHost: 'localhost',
    wsPort: 8080,
    forceTLS: false,
    enabledTransports: ['ws'],
    cluster: 'mt1',
    channelAuthorization: {
        endpoint: 'http://localhost:8000/api/broadcasting/auth',
        transport: 'ajax',
        headers: {
            Authorization: 'Bearer ' + token,
            Accept: 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
        }
    }
});

            pusher.connection.bind('connected', () => {
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = 'متصل ✅';
                log('CONNECTION', { status: 'connected' });
            });

            pusher.connection.bind('error', (err) => {
                log('CONNECTION ERROR', err);
            });

            channel = pusher.subscribe('private-conversation.' + convId);

            channel.bind('message.sent', (data) => {
                log('📨 message.sent', data);
            });

            channel.bind('message.updated', (data) => {
                log('✏️ message.updated', data);
            });

            channel.bind('message.deleted', (data) => {
                log('🗑️ message.deleted', data);
            });

            channel.bind('user.typing', (data) => {
                log('⌨️ user.typing', data);
            });

            channel.bind('pusher:subscription_succeeded', () => {
                log('SUBSCRIBED', { channel: 'private-conversation.' + convId });
            });

            channel.bind('pusher:subscription_error', (err) => {
                log('SUBSCRIPTION ERROR', err);
            });
        }

        function disconnect() {
            if (pusher) {
                pusher.disconnect();
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = 'غير متصل';
                log('DISCONNECTED', {});
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
